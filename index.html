<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Gradiente azul moderno e profissional */
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de partículas flutuantes no fundo */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(96, 165, 250, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .card {
            /* Card com vidro fosco (glassmorphism) */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon-container {
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .icon-bg {
            /* Gradiente azul vibrante para o ícone */
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 10px 30px rgba(59, 130, 246, 0.4),
                0 0 0 10px rgba(59, 130, 246, 0.1);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 10px 30px rgba(59, 130, 246, 0.4),
                    0 0 0 10px rgba(59, 130, 246, 0.1);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 
                    0 15px 40px rgba(59, 130, 246, 0.5),
                    0 0 0 15px rgba(59, 130, 246, 0.15);
            }
        }

        .icon-container svg {
            width: 45px;
            height: 45px;
            color: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }

        h2 {
            font-size: 26px;
            margin-bottom: 14px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 15.5px;
            color: #4a5568;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .verify-btn {
            /* Botão com gradiente azul moderno */
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 28px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho no botão */
        .verify-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.5s;
        }

        .verify-btn:hover::before {
            left: 100%;
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.5);
        }

        .verify-btn:active {
            transform: translateY(-1px);
        }

        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Efeito de partículas decorativas */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 4s ease-in infinite;
        }

        @keyframes rise {
            0% {
                bottom: -10px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon-container">
            <div class="icon-bg">
                <!-- Ícone de Robô -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                    <line x1="8" y1="16" x2="8" y2="16"></line>
                    <line x1="16" y1="16" x2="16" y2="16"></line>
                </svg>
            </div>
        </div>

        <h2>Acesso Protegido</h2>
        <p>Aguarde um momento, estamos verificando automaticamente sua conexão para um acesso seguro.</p>

        <button class="verify-btn" id="verifyBtn">
            <span id="btnText">Não sou um robô</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </div>

    <script>
        // ==============================================================================
        // PROTEÇÃO CONTRA ROBÔS DO TIKTOK
        // Seu link está ofuscado (codificado em Base64) para robôs não conseguirem ler.
        // Se precisar mudar o link no futuro, acesse um site como base64encode.org,
        // cole o seu novo link e coloque o código gerado abaixo:
        // ==============================================================================
        const ENCODED_LINK = "aHR0cHM6Ly90Lm1lL2NhYmFyZWRhZHJlaGVyX2JvdA==";

        // Função para detectar se quem está acessando é o robô do TikTok ou outro crawler
        function isBot() {
            const ua = navigator.userAgent.toLowerCase();
            const isHeadless = navigator.webdriver === true;
            // Procura por termos comuns de robôs e verificadores de anúncios
            const hasBotString = /bot|crawler|spider|crawling|tiktok|facebookexternalhit|slurp|headless|lighthouse/i.test(ua);
            
            // Verifica propriedades suspeitas (ex: tela invisível que robôs usam)
            const isSuspicious = window.outerWidth === 0 && window.outerHeight === 0;

            return isHeadless || hasBotString || isSuspicious;
        }

        function getDeepLink(url) {
            try {
                let urlObj = new URL(url);
                if (urlObj.hostname === 't.me' || urlObj.hostname === 'telegram.me') {
                    let path = urlObj.pathname.substring(1);

                    if (path.startsWith('+')) {
                        return 'tg://join?invite=' + path.substring(1);
                    } else if (path.startsWith('joinchat/')) {
                        return 'tg://join?invite=' + path.substring(9);
                    } else if (path.length > 0) {
                        return 'tg://resolve?domain=' + path;
                    }
                }
            } catch (e) {
                console.error("Erro", e);
            }
            return url;
        }

        const verifyBtn = document.getElementById('verifyBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        function startVerification() {
            // Desativa o botão
            verifyBtn.style.pointerEvents = 'none';
            verifyBtn.style.opacity = '0.9';

            // Oculta o spinner e usa o texto para contagem
            spinner.style.display = 'none';
            btnText.style.display = 'block';
            
            let segundos = 6;
            btnText.innerText = `Aguarde ${segundos}s...`;

            const intervalo = setInterval(() => {
                segundos--;
                if (segundos > 0) {
                    btnText.innerText = `Aguarde ${segundos}s...`;
                } else {
                    btnText.innerText = "Redirecionando...";
                    clearInterval(intervalo);
                }
            }, 1000);

            // Se detectar que é um robô de revisão de anúncios, envia para o Google
            // para que a campanha seja aprovada sem bloqueios
            if (isBot()) {
                setTimeout(() => {
                    window.location.href = "https://www.google.com.br";
                }, 600);
                return;
            }

            // Apenas aqui o código revela o link real
            const LINK_DO_TELEGRAM = atob(ENCODED_LINK);

            // Aguarda 6 segundos e redireciona
            setTimeout(() => {
                const deepLink = getDeepLink(LINK_DO_TELEGRAM);

                // Tenta forçar a saída para o app Telegram
                window.location.href = deepLink;

                // Fallback (caso não consiga abrir o app direto)
                setTimeout(() => {
                    window.open(LINK_DO_TELEGRAM, '_blank');
                    window.location.href = LINK_DO_TELEGRAM;
                }, 1500);
            }, 6000);
        }

        // Inicia a verificação automaticamente
        startVerification();
    </script>
</body>

</html>
